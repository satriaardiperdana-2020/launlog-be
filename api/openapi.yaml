openapi: 3.0.3
info:
  title: Launlog API
  version: 1.0.0
servers:
  - url: /api/v1

# Global security (akan berlaku untuk semua endpoint)
security:
  - BearerAuth: []

paths:
  # ==================== HEALTH CHECK (TANPA AUTH) ====================
  /health:
    get:
      operationId: health
      security: []  # No auth required
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  # ==================== AUTH (TANPA AUTH) ====================
  /auth/register:
    post:
      operationId: register
      security: []  # No auth required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      operationId: login
      security: []  # No auth required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== CUSTOMERS (PERLU AUTH) ====================
  /customers:
    get:
      operationId: listCustomers
      summary: Get all customers
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          description: Unauthorized

  /customers/{id}:
    get:
      operationId: getCustomerById
      summary: Get customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Customer not found
    delete:
      operationId: softDeleteCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Soft deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          description: Unauthorized
        '404':
          description: Customer not found

  # ==================== SERVICE CATEGORIES (PERLU AUTH) ====================
  /service-categories:
    get:
      operationId: listServiceCategories
      summary: Get all service categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceCategory'
        '401':
          description: Unauthorized
    post:
      operationId: createServiceCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCategoryInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCategory'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /service-categories/{id}:
    get:
      operationId: GetServiceCategoryById
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCategory'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      operationId: updateServiceCategory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCategoryInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCategory'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found
    delete:
      operationId: softDeleteServiceCategory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Soft deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
        '404':
          description: Not found

  # ==================== SERVICES (PERLU AUTH) ====================
  /services:
    get:
      operationId: listServices
      summary: Get all services with category name
      parameters:
        - name: categoryId
          in: query
          schema: { type: integer }
          description: Filter by category ID
        - name: search
          in: query
          schema: { type: string }
          description: Search by service name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceWithCategory'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createService
      summary: Create new service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /services/{id}:
    get:
      operationId: getServiceById
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      operationId: updateService
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found
    delete:
      operationId: softDeleteService
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Soft deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /services/{id}/detail:
    get:
      operationId: getServiceDetail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDetail'
        '401':
          description: Unauthorized
        '404':
          description: Not found

  # ==================== PAYMENT METHODS (PERLU AUTH) ====================
  /payment-methods:
    get:
      operationId: listPaymentMethods
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
        '401':
          description: Unauthorized

  # ==================== TRANSACTIONS (PERLU AUTH) ====================
  /transactions:
    post:
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listTransactions
      parameters:
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: type                    # ← TAMBAHKAN INI
          in: query
          schema:
            type: string
            enum: [ income, expenditure ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '401':
          description: Unauthorized

  /transactions/{id}/payments:
    post:
      operationId: addPayment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /transactions/{id}:
    put:
      operationId: updateTransaction
      summary: Update transaction (income)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          description: Transaction Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      operationId: softDeleteTransaction
      summary: Soft delete transaction
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Soft deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions/{id}/restore:
    post:
      operationId: restoreTransaction
      summary: Restore soft deleted transaction
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /transactions/report:
    get:
      operationId: getTransactionReport
      summary: Get transaction report by date range
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
        - name: type
          in: query
          schema:
            type: string
            enum: [ income, expenditure ]
          description: Filter by transaction type (optional)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionReportItem'
                  summary:
                    type: object
                    properties:
                      totalIncome:
                        type: number
                      totalExpense:
                        type: number
                      netProfit:
                        type: number
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== Expenses ====================
  /expenses:
    post:
      operationId: createExpense
      summary: Create new expense (pengeluaran)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequestBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listExpenses
      summary: List all expenses
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

  /expenses/{id}:
    get:
      operationId: getExpense
      summary: Get expense by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateExpense
      summary: Update expense
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExpenseInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Expense Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      operationId: softDeleteExpense
      summary: Soft delete expense
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Soft deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  # ==================== DASHBOARD & REPORTS (PERLU AUTH) ====================
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          description: Unauthorized

  /reports/profit-loss:
    get:
      operationId: profitLossReport
      parameters:
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitLossReport'
        '401':
          description: Unauthorized

components:
  schemas:
    # ... (semua schemas tetap sama seperti yang Anda miliki) ...
    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        name: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }

    Customer:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        phone: { type: string }
        address: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }

    CustomerInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        phone: { type: string }
        address: { type: string }
        is_active: { type: boolean }

    CustomerDetail:
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          properties:
            orders: { type: array }

    ServiceCategory:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ServiceCategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        sortOrder: { type: integer }

    Service:
      type: object
      properties:
        id: { type: integer }
        categoryId: { type: integer }
        name: { type: string }
        price: { type: number }
        estimation: { type: string }
        minQuantity: { type: number }
        unit: { type: string }
        description: { type: string }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ServiceWithCategory:
      type: object
      properties:
        id: { type: integer }
        categoryId: { type: integer }
        categoryName: { type: string }
        name: { type: string }
        price: { type: number }
        estimation: { type: string }
        minQuantity: { type: number }
        unit: { type: string }
        description: { type: string }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ServiceDetail:
      type: object
      properties:
        id: { type: integer }
        categoryId: { type: integer }
        categoryName: { type: string }
        name: { type: string }
        price: { type: number }
        estimation: { type: string }
        minQuantity: { type: number }
        unit: { type: string }
        description: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ServiceInput:
      type: object
      required: [categoryId, name, price, estimation]
      properties:
        categoryId: { type: integer }
        name: { type: string }
        price: { type: number, nullable: true }
        estimation: { type: string }
        minQuantity: { type: number, default: 1 }
        unit: { type: string, default: "kg" }
        description: { type: string }
        sortOrder: { type: integer }

    ServiceUpdate:
      type: object
      required: [ categoryId, name, price, estimation ]
      properties:
        categoryId: { type: integer }
        name: { type: string }
        price: { type: number, nullable: true }
        estimation: { type: string }
        minQuantity: { type: number, default: 1 }
        unit: { type: string, default: "kg" }
        description: { type: string }
        sortOrder: { type: integer }

    UpdateTransactionInput:
      type: object
      properties:
        customerId:
          type: integer
        paymentStatus:
          type: string
          enum: [ unpaid, dp, paid ]
        isDelivery:
          type: boolean
        totalAmount:
          type: number
        notes:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              qty:
                type: number
              unitPrice:
                type: number
              notes:
                type: string


    # ==================== EXPENSES ====================
    ExpenseRequestBody:
      type: object
      required:
        - userId
        - supplier
        - expenseCategory
        - totalAmount
      properties:
        userId:
          type: integer
        supplier:
          type: string
        expenseCategory:
          type: string
        totalAmount:
          type: number
        paidAmount:
          type: number
          description: Amount paid (optional, default = totalAmount)
        notes:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              itemName:
                type: string
              qty:
                type: number
              unitPrice:
                type: number
              notes:
                type: string

    UpdateExpenseInput:
      type: object
      properties:
        supplier:
          type: string
        expenseCategory:
          type: string
        totalAmount:
          type: number
        paidAmount:
          type: number
        notes:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              itemName:
                type: string
              qty:
                type: number
              unitPrice:
                type: number
              notes:
                type: string

    PaymentMethod:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        isActive: { type: boolean }

    TransactionItem:
      type: object
      properties:
        serviceId: { type: integer }
        qty: { type: number }
        notes: { type: string }

    TransactionInput:
      type: object
      required: [userId, items]
      properties:
        userId: { type: integer }
        customerId: { type: integer }
        isDelivery: { type: boolean }
        notes: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionItem'

    Transaction:
      type: object
      properties:
        id: { type: integer }
        invoiceNo: { type: string }
        userId: { type: integer }
        customerId: { type: integer }
        paymentMethodId: { type: integer }
        paymentStatus: { type: string }
        totalAmount: { type: number }
        paidAmount: { type: number }
        notes: { type: string }
        transactionDate: { type: string, format: date-time }

    PaymentInput:
      type: object
      required: [paymentMethodId, amount, paymentType, userId]
      properties:
        paymentMethodId: { type: integer }
        amount: { type: number }
        paymentType: { type: string, enum: [dp, settlement] }
        userId: { type: integer }
        notes: { type: string }

    DashboardResponse:
      type: object
      properties:
        todayIncome: { type: number }
        todayExpense: { type: number }

    ProfitLossReport:
      type: object
      properties:
        totalIncome: { type: number }
        totalExpense: { type: number }
        profit: { type: number }
        details:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              income: { type: number }
              expense: { type: number }

    TransactionReportItem:
      type: object
      properties:
        id:
          type: integer
        invoiceNo:
          type: string
        transactionType:
          type: string
        userId:
          type: integer
        customerId:
          type: integer
        customerName:
          type: string
        supplier:
          type: string
        expenseCategory:
          type: string
        paymentStatus:
          type: string
        totalAmount:
          type: number
        paidAmount:
          type: number
        notes:
          type: string
        transactionDate:
          type: string
          format: date-time
  # ==================== SECURITY SCHEMES ====================
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT